aid: alethea
name: Alethea
description: >-
  Alethea is an AI-powered risk intelligence company that operates a proactive
  narrative and disinformation risk management platform. Its flagship product,
  Artemis, is a threat intelligence and narrative-risk mitigation platform that
  detects coordinated inauthentic behavior, influence operations, and emerging
  online narratives before they escalate into reputational or operational
  crises. Complementary offerings include Risk Radar (a threat-visibility
  dashboard), an agentic AI takedown agent for automated mitigation, and Alethea
  Insights macro threat analysis. The company was surfaced as a portfolio
  company of GV and Multicoin Capital and added to the API Evangelist network.
  Alethea is an enterprise, engagement-led platform and does not currently
  publish a public developer API, SDKs, or a self-service developer portal.
